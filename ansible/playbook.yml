---
# Доставка и развёртывание Todo List на сервер Ubuntu/Debian.
#
# С управляющей машины (Linux или WSL), из каталога ansible:
#   ansible-playbook playbook.yml
#
# Адрес сервера — в inventory.ini.
# Порт, каталог и параметры базы — в group_vars/all.yml.

- name: Развернуть веб-приложение Todo List
  hosts: servers
  become: true

  handlers:
    - name: Перезапустить PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

    - name: Перезапустить приложение
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted
        daemon_reload: true

  tasks:
    - name: Проверить, что сервер на Debian или Ubuntu
      ansible.builtin.assert:
        that: ansible_os_family == "Debian"
        fail_msg: "Плейбук рассчитан на Ubuntu или Debian."

    - name: Установить системные пакеты
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: true

    - name: Проверить репозиторий NodeSource
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/nodesource.list
        - /etc/apt/sources.list.d/nodesource.sources
      register: nodesource_repo

    - name: Скачать скрипт репозитория Node.js 22
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/setup_22.x
        dest: /tmp/nodesource_setup.sh
        mode: "0755"
      when: nodesource_repo.results | selectattr("stat.exists") | list | length == 0

    - name: Подключить репозиторий Node.js 22
      ansible.builtin.command: bash /tmp/nodesource_setup.sh
      when: nodesource_repo.results | selectattr("stat.exists") | list | length == 0

    - name: Установить Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Запустить PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Найти pg_hba.conf
      ansible.builtin.find:
        paths: /etc/postgresql
        patterns: pg_hba.conf
        recurse: true
      register: pg_hba_files

    - name: Убедиться, что конфигурация PostgreSQL найдена
      ansible.builtin.assert:
        that: pg_hba_files.matched | int > 0
        fail_msg: "Не найден pg_hba.conf."

    - name: Разрешить вход в PostgreSQL с localhost по IPv4
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s+'
        line: "host all all 127.0.0.1/32 scram-sha-256"
      loop: "{{ pg_hba_files.files | map(attribute='path') | list }}"
      notify: Перезапустить PostgreSQL

    - name: Разрешить вход в PostgreSQL с localhost по IPv6
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^host\s+all\s+all\s+::1/128\s+'
        line: "host all all ::1/128 scram-sha-256"
      loop: "{{ pg_hba_files.files | map(attribute='path') | list }}"
      notify: Перезапустить PostgreSQL

    - name: Применить настройки PostgreSQL до миграций
      ansible.builtin.meta: flush_handlers

    - name: Задать пароль пользователя базы
      ansible.builtin.command:
        argv:
          - psql
          - -v
          - ON_ERROR_STOP=1
          - -c
          - "ALTER USER {{ db_user }} WITH PASSWORD '{{ db_password }}'"
      become_user: postgres
      no_log: true
      changed_when: false

    - name: Создать базу приложения, если её ещё нет
      ansible.builtin.shell: |
        psql -v ON_ERROR_STOP=1 <<SQL
        SELECT 'CREATE DATABASE {{ db_name }}'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ db_name }}')\gexec
        SQL
      args:
        executable: /bin/bash
      become_user: postgres
      register: create_db
      changed_when: "'CREATE DATABASE' in create_db.stdout"

    - name: Создать системного пользователя приложения
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_dir }}"
        create_home: false

    - name: Создать каталог приложения
      ansible.builtin.file:
        path: "{{ app_dir }}/backend"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Доставить файлы интерфейса
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      loop:
        - index.html
        - index.js
        - style.css
      notify: Перезапустить приложение

    - name: Доставить исходники backend
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../backend/{{ item }}/"
        dest: "{{ app_dir }}/backend/{{ item }}/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      loop:
        - config
        - controllers
        - migrations
        - models
        - routes
        - swagger
      notify: Перезапустить приложение

    - name: Доставить файлы запуска backend
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../backend/{{ item }}"
        dest: "{{ app_dir }}/backend/{{ item }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      loop:
        - package.json
        - package-lock.json
        - server.js
      notify: Перезапустить приложение

    - name: Записать настройки подключения к базе
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ app_dir }}/backend/config/config.json"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0640"
      no_log: true
      notify: Перезапустить приложение

    - name: Записать переменные окружения
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/backend/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      no_log: true
      notify: Перезапустить приложение

    - name: Отдать файлы пользователю сервиса
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    - name: Установить зависимости Node.js
      ansible.builtin.command: npm ci --omit=dev
      args:
        chdir: "{{ app_dir }}/backend"
      become_user: "{{ app_user }}"
      environment:
        HOME: "{{ app_dir }}"
        npm_config_fund: "false"
        npm_config_audit: "false"
      register: npm_ci
      changed_when: "'added' in npm_ci.stdout"
      notify: Перезапустить приложение

    - name: Применить миграции базы
      ansible.builtin.command: npx --yes sequelize-cli db:migrate
      args:
        chdir: "{{ app_dir }}/backend"
      become_user: "{{ app_user }}"
      environment:
        HOME: "{{ app_dir }}"
        NODE_ENV: production
      register: db_migrate
      changed_when: "'migrated' in db_migrate.stdout"

    - name: Установить unit systemd
      ansible.builtin.template:
        src: todo-list.service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: "0644"
      notify: Перезапустить приложение

    - name: Включить и запустить приложение
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Применить перезапуск приложения
      ansible.builtin.meta: flush_handlers

    - name: Дождаться ответа приложения
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

    - name: Сообщить адрес приложения
      ansible.builtin.debug:
        msg: "Приложение доступно по адресу http://{{ ansible_host | default(inventory_hostname) }}:{{ app_port }}"
